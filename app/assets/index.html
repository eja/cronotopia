<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronotopia</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/maplibre-gl.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav id="app-header" class="navbar navbar-dark bg-dark px-3 shadow-sm d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <img src="pics/cronotopia.svg" width="30" height="30" class="d-inline-block align-top me-2" alt="Logo" onerror="this.style.display='none'">
            <span class="navbar-brand mb-0 fw-bold tracking-tight">Cronotopia</span>
        </div>
        <div>
            <button id="mobile-toggle-btn" class="btn btn-outline-light btn-sm px-3" type="button">Map</button>
        </div>
    </nav>

    <div id="main-container">
        <div id="sidebar">
            <div id="filter-pane" class="p-3">
                <div class="row g-2 mb-2">
                    <div class="col-5">
                        <label class="form-label form-label-sm mb-1 text-muted small">Year</label>
                        <input type="number" id="input-year" class="form-control form-control-sm" placeholder="e.g. 1914">
                    </div>
                    <div class="col-3">
                        <label class="form-label form-label-sm mb-1 text-muted small">Month</label>
                        <input type="number" id="input-month" min="1" max="12" class="form-control form-control-sm" placeholder="1-12">
                    </div>
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Day</label>
                        <input type="number" id="input-day" min="1" max="31" class="form-control form-control-sm" placeholder="1-31">
                    </div>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Date Range</label>
                        <select id="select-range" class="form-select form-select-sm">
                            <option value="0">Exact</option>
                            <option value="-1">Before</option>
                            <option value="1">After</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Search Mode</label>
                        <select id="select-mode" class="form-select form-select-sm">
                            <option value="">Hybrid</option>
                            <option value="semantic">Semantic</option>
                            <option value="lexical">Lexical</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Restrict Map</label>
                        <select id="select-visible-map" class="form-select form-select-sm">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                </div>

                <div class="input-group mb-2">
                    <input type="search" id="input-query" class="form-control form-control-sm" placeholder="Search text, people, places..." autocomplete="off">
                    <button class="btn btn-primary btn-sm" id="btn-search" type="button">Search</button>
                </div>
            </div>

            <div class="px-3 py-2 bg-light border-bottom d-flex justify-content-between align-items-center">
                <span id="results-count" class="text-muted small fw-bold">Ready</span>
                <span id="results-meta" class="badge bg-secondary">0 items</span>
            </div>

            <div id="results-pane">
                <div id="results-placeholder" class="text-center text-muted py-5">
                    <p class="mb-1">🔍 Enter a query, year, or pan the map.</p>
                    <small>Search across Wikidata events and Wikipedia articles.</small>
                </div>
                <div id="results-list" class="d-flex flex-column gap-2"></div>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <div class="modal fade" id="articleModal" tabindex="-1" style="display:none;" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title mb-0" id="articleModalTitle">Article</h5>
                        <small class="text-muted" id="articleModalSubtitle"></small>
                    </div>
                    <button type="button" class="btn-close" id="btn-modal-close-x" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="articleModalBody">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-modal-close">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/maplibre-gl.js"></script>
    <script src="js/basemaps.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
