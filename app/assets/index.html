<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronotopia</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/maplibre-gl.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav id="app-header" class="navbar navbar-dark bg-dark px-3 shadow-sm d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <img src="pics/cronotopia.svg" width="30" height="30" class="d-inline-block align-top me-2" alt="Logo" onerror="this.style.display='none'">
            <span class="navbar-brand mb-0 fw-bold tracking-tight">Cronotopia</span>
        </div>
        <div>
            <button id="mobile-toggle-btn" class="btn btn-outline-light btn-sm px-3" type="button"><i class="bi bi-map"></i> Map</button>
        </div>
    </nav>

    <div id="main-container">
        <div id="sidebar">
            <div id="filter-pane" class="p-3">
                <div class="row g-2 mb-2">
                    <div class="col-5">
                        <label class="form-label form-label-sm mb-1 text-muted small">Year</label>
                        <input type="number" id="input-year" class="form-control form-control-sm" placeholder="e.g. 1914">
                    </div>
                    <div class="col-3">
                        <label class="form-label form-label-sm mb-1 text-muted small">Month</label>
                        <input type="number" id="input-month" min="1" max="12" class="form-control form-control-sm" placeholder="1-12">
                    </div>
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Day</label>
                        <input type="number" id="input-day" min="1" max="31" class="form-control form-control-sm" placeholder="1-31">
                    </div>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Date Range</label>
                        <select id="select-range" class="form-select form-select-sm">
                            <option value="0">Exact</option>
                            <option value="-1">Before</option>
                            <option value="1">After</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Search Mode</label>
                        <select id="select-mode" class="form-select form-select-sm">
                            <option value="hybrid">Hybrid</option>
                            <option value="entity">Entity</option>
                            <option value="lexical">Lexical</option>
                            <option value="semantic">Semantic</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <label class="form-label form-label-sm mb-1 text-muted small">Restrict Map</label>
                        <select id="select-visible-map" class="form-select form-select-sm">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                </div>

                <div class="input-group mb-2">
                    <input type="search" id="input-query" class="form-control form-control-sm" placeholder="Search text, people, places..." autocomplete="off">
                    <button class="btn btn-primary btn-sm" id="btn-search" type="button"><i class="bi bi-search"></i> Search</button>
                </div>
            </div>

            <div class="px-3 py-2 bg-light border-bottom d-flex justify-content-between align-items-center">
                <span id="results-count" class="text-muted small fw-bold">Ready</span>
                <span id="results-meta" class="badge bg-secondary">0 items</span>
            </div>

            <div id="results-pane">
                <div id="results-placeholder" class="text-center text-muted py-5">
                    <p class="mb-1">🔍 Enter a query, year, or pan the map.</p>
                    <small>Search across Wikidata events and Wikipedia articles.</small>
                </div>
                <div id="results-list" class="d-flex flex-column gap-2"></div>
            </div>
        </div>

        <div id="map-container" class="position-relative">
            <div id="map-loader" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center bg-light bg-opacity-75" style="z-index: 1000;">
                <div class="spinner-border text-primary mb-2" role="status" style="width: 2.5rem; height: 2.5rem;">
                    <span class="visually-hidden">Loading map...</span>
                </div>
                <div class="small text-muted fw-semibold">Loading map...</div>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <div class="modal fade" id="layerModal" tabindex="-1" style="display:none;" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content shadow">
                <div class="modal-header py-2 px-3">
                    <h6 class="modal-title fw-bold mb-0">Map Layers</h6>
                    <button type="button" class="btn-close" id="btn-layer-modal-close-x" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3">
                    <div class="d-flex flex-column gap-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-check-label fw-semibold small mb-0" for="layer-toggle-contours">Contours</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="layer-toggle-contours">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-check-label fw-semibold small mb-0" for="layer-toggle-elevation">3D Terrain</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="layer-toggle-elevation">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-check-label fw-semibold small mb-0" for="layer-toggle-buildings">Buildings</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="layer-toggle-buildings" checked>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-check-label fw-semibold small mb-0" for="layer-toggle-pois">Labels</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="layer-toggle-pois" checked>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-check-label fw-semibold small mb-0" for="layer-toggle-roads">Roads</label>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="layer-toggle-roads" checked>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer py-2 px-3">
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-layer-modal-close"><i class="bi bi-x-lg"></i> Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="articleModal" tabindex="-1" style="display:none;" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title mb-0" id="articleModalTitle">Article</h5>
                    </div>
                    <button type="button" class="btn-close" id="btn-modal-close-x" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="articleModalBody">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between align-items-center">
                    <div id="articleModalPagination" class="d-flex align-items-center gap-2" style="display: none;">
                        <button type="button" class="btn btn-outline-primary btn-sm" id="btn-book-prev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
                        <span id="book-page-info" class="small text-muted fw-semibold"></span>
                        <button type="button" class="btn btn-outline-primary btn-sm" id="btn-book-next" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
                    </div>
                    <button type="button" class="btn btn-secondary btn-sm ms-auto" id="btn-modal-close"><i class="bi bi-x-lg"></i> Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="scoreModal" tabindex="-1" style="display:none;" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-xl">
            <div class="modal-content">
                <div class="modal-header py-2 px-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-primary btn-sm px-3" id="btn-score-play-pause"><i class="bi bi-play-fill"></i> Play</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm px-2" id="btn-score-stop"><i class="bi bi-stop-fill"></i> Stop</button>
                        <h5 class="modal-title mb-0 fs-6 fw-bold ms-1" id="scoreModalTitle">Score</h5>
                    </div>
                    <button type="button" class="btn-close" id="btn-score-modal-close-x" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 position-relative" id="scoreModalBody" style="min-height: 500px; max-height: calc(100vh - 160px); overflow-y: auto;">
                    <div id="alphatab-container"></div>
                </div>
                <div class="modal-footer py-2 px-3">
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-score-modal-close"><i class="bi bi-x-lg"></i> Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/init.js"></script>
    <script src="js/alphaTab.min.js"></script>
    <script src="js/maplibre-gl.min.js"></script>
    <script src="js/maplibre-contour.min.js"></script>
    <script src="js/basemaps.min.js"></script>
    <script src="js/map.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/media.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
